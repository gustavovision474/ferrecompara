<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FerreExpress - Comparador Ferretero</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E8541C" />
    <link rel="apple-touch-icon" href="/assets/images/ferrecompara-logo.png" />
  </head>
  <body class="bg-[#f8f9ff] text-gray-900 antialiased selection:bg-orange-500/20 selection:text-orange-900">
    <div id="error-overlay" style="color: red; font-family: monospace; background: #fff; position: absolute; z-index: 999999; padding: 20px; word-break: break-all; top: 0; left: 0; display: none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('JS Error:', message, source, lineno, colno, error);
        var el = document.getElementById('error-overlay');
        if (el && message.indexOf('Bootstrap Error') !== -1) {
          el.style.display = 'block';
          el.innerHTML += '<p><strong>Bootstrap Error:</strong> ' + message + '<br/>' + source + ':' + lineno + ':' + colno + '<br/>' + (error ? error.stack : '') + '</p>';
        }
      };
      window.onunhandledrejection = function(event) {
        console.error('Unhandled Promise:', event.reason);
      };
    </script>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
  </body>
</html>
